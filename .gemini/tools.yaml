
sources:
  test-db:
    type: sqlite
    database: "/home/vlad/PycharmProjects/Liquidity_orchestrator/test.db"

tools:
  search_order_by_incoming_amount:
    type: sqlite-sql
    source: test-db
    description: Search order by incoming amount
    parameters:
      - name: incoming_amount
        type: integer
        description: The incoming amount of order.
    statement: |
      SELECT id, incoming_amount, status, created_at 
      FROM orders 
      WHERE incoming_amount = $1 
      ORDER BY created_at DESC 
      LIMIT 10;
  execute_sql_tool:
    type: sqlite-execute-sql
    source: test-db
    description: Use this tool to execute a SQL statement.
---
kind: toolsets
name: my_second_toolset
tools:
  - search_order_by_incoming_amount

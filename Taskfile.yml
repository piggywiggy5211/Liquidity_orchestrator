version: '3'

tasks:
  check:
    desc: Run all checks (tests, linter, type hints)
    deps: [ test:lib, test:orchestrator, test:mock, ruff, mypy ]
    aliases: [ x ]
    
  mypy:
    desc: Run type checking for all apps
    cmds:
      - uv run mypy apps/
      
  ruff:
    desc: Run linters and formatters
    cmds:
      - uv run ruff check apps/ --fix
      - uv run ruff format apps/
      
  test:lib:
    desc: Run tests ONLY for the shared library
    dir: lib
    cmds:
      - uv run pytest -vv
      
  test:orchestrator:
    desc: Run tests ONLY for the main application
    dir: apps/liquidity_orchestrator
    cmds:
      - uv run pytest -vv
      
  test:mock:
    desc: Run tests ONLY for mock providers
    dir: apps/mock_providers
    cmds:
      - uv run pytest -vv
      
  test:all:
    desc: Run all tests in the monorepo
    cmds:
      - task: test:lib
      - task: test:orchestrator
      - task: test:mock
      
  run:orchestrator:
    desc: Run main application (Liquidity Orchestrator)
    dir: apps/liquidity_orchestrator
    cmds:
      - uv run python -m entrypoints.fastapi.main
      
  run:mock:
    desc: Run mock providers application
    dir: apps/mock_providers
    cmds:
      - uv run python -m entrypoints.fastapi.main

dotenv: [ '.env' ]

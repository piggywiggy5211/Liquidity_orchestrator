[project]
name = "liquidity-orchestrator-workspace"
version = "0.1.0"
requires-python = ">=3.14"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "waddles0618", email = "waddles0618@gmail.com" }
]
dependencies = []
[dependency-groups]
dev = [
    "mypy>=1.19.1,<2.0.0",
    "ruff>=0.15.4,<0.16.0",
    "diagrams>=0.25.1,<0.26.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "testcontainers[postgres]>=4.14.1,<5.0.0",
    "types-cachetools>=6.2.0.20251022,<7.0.0",
    "respx>=0.22.0",
]


[tool.uv.workspace]
members = [
    "apps/*",
    "lib",
]

[tool.mypy]
ignore_missing_imports = true



[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
extend-select = ["E501"]  # check string length
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "Q", # quotes
]
per-file-ignores = { "**/alembic/versions/*.py" = ["E501"] }
[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
exclude = ["*.pyi"]

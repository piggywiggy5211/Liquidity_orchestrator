[project]
name = "liquidity-orchestrator-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "mypy~=1.19.1",
    "ruff~=0.15.4",
    "diagrams>=0.25.1",
]
[dependency-groups]
dev = [
    "mypy~=1.19.1",
    "ruff~=0.15.4",
    "diagrams>=0.25.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]


[tool.uv.workspace]
members = [
    "apps/*",
    "lib",
]

[tool.mypy]
ignore_missing_imports = true



[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
extend-select = ["E501"]  # check string length
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "Q", # quotes

]
[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
exclude = ["*.pyi"]

[project]
name = "mock-providers"
version = "0.1.0"
requires-python = ">=3.14"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "waddles0618", email = "waddles0618@gmail.com" }
]
dependencies = [
    "cachetools>=7.0.1,<8.0.0",
    "lib[fastapi]",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
lib = { workspace = true }

[project]
name = "liquidity-orchestrator"
version = "0.1.0"
description = "Example of liquidity Orchestrator for Onramp/Offramp"
requires-python = ">=3.14"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "waddles0618", email = "waddles0618@gmail.com" }
]
dependencies = [
    "dishka>=1.2.0,<2.0.0",
    "cachetools>=7.0.1,<8.0.0",
    "alembic>=1.18.4,<2.0.0",
    "sqlalchemy>=2.0.46,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "lib[fastapi,http_client,db]",
]

[dependency-groups]
dev = []

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
lib = { workspace = true }

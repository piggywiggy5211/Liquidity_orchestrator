[project]
name = "liquidity-orchestrator"
version = "0.1.0"
description = "Example of liquidity Orchestrator for Onramp/Offramp"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings~=2.12.0",
    "cachetools~=7.0.1",
    "aiosqlite~=0.22.1",
    "alembic~=1.18.4",
    "sqlalchemy~=2.0.46",
    "pandas~=3.0.0",
    "asyncpg>=0.31.0",
    "lib[fastapi,http_client,db]",
]

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.14.1",
    "types-cachetools>=6.2.0.20251022",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"

[tool.uv.sources]
lib = { workspace = true }

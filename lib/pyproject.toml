[project]
name = "lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "waddles0618", email = "waddles0618@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3,<0.8.0",
    "opentelemetry-api>=1.39.1,<2.0.0",
    "opentelemetry-sdk>=1.39.1,<2.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
]

[project.optional-dependencies]
fastapi = [
    "uvicorn>=0.40.0,<0.41.0",
    "fastapi>=0.128.8,<0.129.0",
    "opentelemetry-instrumentation-fastapi>=0.60b1,<1.0.0",
]
http_client = [
    "httpx>=0.28.1,<0.29.0",
]
db = [
    "opentelemetry-instrumentation-sqlalchemy>=0.60b1,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
